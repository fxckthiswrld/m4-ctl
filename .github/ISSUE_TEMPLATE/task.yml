name: Task
description: Propose a concrete maintenance, engineering, or documentation task
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for scoped work that is neither a bug report nor a user-facing feature request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same task.
          required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the concrete outcome this task should produce.
      placeholder: Update, refactor, investigate, document, or test ...
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Explain why this work is needed and who or what it affects.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that must be met for this task to be complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop UI
        - Bluetooth bridge
        - GAIA3 protocol
        - Build and release
        - Tests
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Implementation notes
      description: Add constraints, relevant files, references, or a suggested approach.
