name: Build and Test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run bridge tests
        run: uv run python -m unittest discover -s tests -v

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check UI
        working-directory: ui
        run: npx tsc --noEmit

      - name: Build UI
        working-directory: ui
        run: npm run build

  build-windows:
    name: Windows app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build Windows installer and portable app
        working-directory: ui
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momentum-4-control-windows
          path: ui/release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build macOS archives
        working-directory: ui
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Upload bridge binary
        uses: actions/upload-artifact@v4
        with:
          name: m4-bridge-${{ matrix.arch }}
          path: build/bridge/mac/m4-bridge
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momentum-4-control-macos-${{ matrix.arch }}
          path: |
            ui/release/*.dmg
            ui/release/*.zip
          if-no-files-found: error
          retention-days: 14

  build-macos-universal:
    name: macOS universal app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    needs: [build-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Download arm64 bridge
        uses: actions/download-artifact@v4
        with:
          name: m4-bridge-arm64
          path: build/bridge/arm64

      - name: Download x64 bridge
        uses: actions/download-artifact@v4
        with:
          name: m4-bridge-x64
          path: build/bridge/x64

      - name: Create universal bridge
        run: |
          mkdir -p build/bridge/mac
          lipo -create build/bridge/arm64/m4-bridge build/bridge/x64/m4-bridge -output build/bridge/mac/m4-bridge
          chmod +x build/bridge/mac/m4-bridge

      - name: Build universal macOS archive
        working-directory: ui
        run: npm run build && npx electron-builder --mac --universal

      - name: Upload universal macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momentum-4-control-macos-universal
          path: |
            ui/release/*.dmg
            ui/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-macos-universal]
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: momentum-4-control-windows
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: momentum-4-control-macos-*
          path: artifacts/macos
          merge-multiple: false

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/*.exe
            artifacts/macos/**/*.dmg
            artifacts/macos/**/*.zip
