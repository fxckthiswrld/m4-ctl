name: Build and Test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: blacksmith-4vcpu-ubuntu-latest
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run bridge tests
        run: uv run python -m unittest discover -s tests -v

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check UI
        working-directory: ui
        run: npx tsc --noEmit

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Test Electron bridge lifecycle
        working-directory: ui
        run: npm run test:desktop

      - name: Test UI behavior
        working-directory: ui
        run: xvfb-run --auto-servernum npx electron --no-sandbox tests/status-polling.cjs

      - name: Test real desktop lifecycle
        working-directory: ui
        run: xvfb-run --auto-servernum npx electron --no-sandbox tests/desktop-smoke.cjs

  test-macos:
    name: macOS Bluetooth event loop
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Test native Cocoa event delivery and macOS transport
        run: uv run python -m unittest discover -s tests -p 'test_mac*.py' -v

  build-windows:
    name: Windows app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build Windows installer and portable app
        working-directory: ui
        run: npm run dist:win

      - name: Smoke-test packaged bridge
        run: uv run python tests/smoke_bridge.py build/bridge/win/m4-bridge/m4-bridge.exe

      - name: Smoke-test packaged desktop resources
        working-directory: ui
        env:
          M4_SMOKE_RESOURCES: release/win-unpacked/resources
        run: npx electron tests/desktop-smoke.cjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: momentum-4-control-windows
          path: ui/release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            # Blacksmith arm64 mac runners (M-series); PyInstaller cannot
            # cross-compile, so this job builds the arm64 bridge natively.
            runner: blacksmith-6vcpu-macos-15
          - arch: x64
            # Blacksmith ships Apple Silicon only; the x64 bridge must be
            # built on Intel hardware, so this job stays on GitHub.
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    needs: [test, test-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build macOS archives
        working-directory: ui
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Smoke-test packaged bridge
        run: uv run python tests/smoke_bridge.py build/bridge/mac/m4-bridge/m4-bridge

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: momentum-4-control-macos-${{ matrix.arch }}
          path: |
            ui/release/*.dmg
            ui/release/*.zip
          if-no-files-found: error
