name: Build and Test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run bridge tests
        run: uv run python -m unittest discover -s tests -v

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check UI
        working-directory: ui
        run: npx tsc --noEmit

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Test Electron bridge lifecycle
        working-directory: ui
        run: npm run test:desktop

      - name: Test UI behavior
        working-directory: ui
        run: xvfb-run --auto-servernum npx electron --no-sandbox tests/status-polling.cjs

      - name: Test real desktop lifecycle
        working-directory: ui
        run: xvfb-run --auto-servernum npx electron --no-sandbox tests/desktop-smoke.cjs

  test-macos:
    name: macOS Bluetooth event loop
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Test native Cocoa event delivery and macOS transport
        run: uv run python -m unittest discover -s tests -p 'test_mac*.py' -v

  build-windows:
    name: Windows app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build Windows installer and portable app
        working-directory: ui
        run: npm run dist:win

      - name: Smoke-test packaged bridge
        run: uv run python tests/smoke_bridge.py build/bridge/win/m4-bridge.exe

      - name: Smoke-test packaged desktop resources
        working-directory: ui
        env:
          M4_SMOKE_RESOURCES: release/win-unpacked/resources
        run: npx electron tests/desktop-smoke.cjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momentum-4-control-windows
          path: ui/release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    needs: [test, test-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build macOS archives
        working-directory: ui
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Smoke-test packaged bridge
        run: uv run python tests/smoke_bridge.py build/bridge/mac/m4-bridge

      - name: Upload bridge binary
        uses: actions/upload-artifact@v4
        with:
          name: m4-bridge-${{ matrix.arch }}
          path: build/bridge/mac/m4-bridge
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momentum-4-control-macos-${{ matrix.arch }}
          path: |
            ui/release/*.dmg
            ui/release/*.zip
          if-no-files-found: error
          retention-days: 14

  build-macos-universal:
    name: macOS universal app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    needs: [build-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Download arm64 bridge
        uses: actions/download-artifact@v4
        with:
          name: m4-bridge-arm64
          path: build/bridge/arm64

      - name: Download x64 bridge
        uses: actions/download-artifact@v4
        with:
          name: m4-bridge-x64
          path: build/bridge/x64

      - name: Restore native bridge permissions
        run: chmod +x build/bridge/arm64/m4-bridge build/bridge/x64/m4-bridge

      - name: Build universal macOS archive
        working-directory: ui
        run: npm run build && npx electron-builder --config electron-builder.universal.cjs --mac --universal

      - name: Verify embedded native bridges
        run: |
          lipo "ui/release/mac-universal/Momentum 4 Control.app/Contents/Resources/bridge/arm64/m4-bridge" -verify_arch arm64
          lipo "ui/release/mac-universal/Momentum 4 Control.app/Contents/Resources/bridge/x64/m4-bridge" -verify_arch x86_64
          python3 tests/smoke_bridge.py "ui/release/mac-universal/Momentum 4 Control.app/Contents/Resources/bridge/arm64/m4-bridge"

      - name: Upload universal macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momentum-4-control-macos-universal
          path: |
            ui/release/*.dmg
            ui/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-macos-universal]
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: momentum-4-control-windows
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: momentum-4-control-macos-*
          path: artifacts/macos
          merge-multiple: false

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/*.exe
            artifacts/macos/**/*.dmg
            artifacts/macos/**/*.zip
